---
layout: default
---
<main class="wrap">
  <div class="intro">
    <img class="intro-photo" src="{{ page.photo | default: '/images/profile.jpg' }}" alt="{{ site.name }}">
    <h1 class="site-title">{{ page.headline | default: site.name }}{% if page.subtitle %}, {{ page.subtitle }}{% endif %}</h1>

    {{ content }}

    <nav class="profile-links" aria-label="Profiles">
      {% if site.social_links.linkedin %}<a href="https://www.linkedin.com/in/{{ site.social_links.linkedin }}">LinkedIn</a>{% endif %}
      {% if site.social_links.twitter %}<span aria-hidden="true">&middot;</span><a href="https://x.com/{{ site.social_links.twitter }}">X</a>{% endif %}
      {% if site.social_links.github %}<span aria-hidden="true">&middot;</span><a href="https://github.com/{{ site.social_links.github }}">GitHub</a>{% endif %}
    </nav>
  </div>
</main>
