---
layout: default
---
<article class="page wrap">
  <header class="page__head">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.lead %}<p class="page__lead">{{ page.lead }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
