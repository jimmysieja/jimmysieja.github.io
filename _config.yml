# --- Site basics -------------------------------------------------------------
locale                   : "en-US"
title                    : "Jimmy Sieja"
title_separator          : "·"
name                     : "Jimmy Sieja"
description              : "Research Analyst at the Federal Reserve Bank of Atlanta."
url                      : "https://jimmysieja.github.io"
baseurl                  : ""
repository               : "jimmysieja/jimmysieja.github.io"

# --- Author / identity (used by jekyll-seo-tag and the footer) --------------
author:
  name    : "Jimmy Sieja"
  bio     : "Research Analyst at the Federal Reserve Bank of Atlanta."

# Social handles — consumed in _includes/footer.html and _includes/head.html
social_links:
  linkedin : "jimmy-sieja"       # linkedin.com/in/<handle>
  twitter  : "jimmysieja"        # x.com/<handle>
  github   : "jimmysieja"        # github.com/<handle>

# jekyll-seo-tag structured social profile
social:
  type  : Person
  name  : "Jimmy Sieja"
  links:
    - "https://www.linkedin.com/in/jimmy-sieja"
    - "https://x.com/jimmysieja"
    - "https://github.com/jimmysieja"
twitter:
  username: "jimmysieja"

# --- Build -----------------------------------------------------------------
markdown        : kramdown
highlighter     : rouge
kramdown:
  input         : GFM
  hard_wrap     : false
  auto_ids      : true
  smart_quotes  : lsquo,rsquo,ldquo,rdquo

permalink       : /:title/
timezone        : America/New_York
encoding        : "utf-8"

sass:
  style: compressed

include:
  - _pages
  - files

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle
  - scratchpad

keep_files:
  - .git

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Every file in _pages is a standalone page unless it says otherwise
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
